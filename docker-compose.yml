services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: udyamsaathi-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: udyamsaathi-ui
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - UDYAMSAATHI_API_URL=http://api:8000
    command: ["python", "-m", "streamlit", "run", "ui/app.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    depends_on:
      - api
